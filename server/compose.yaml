# La Familia local stack: the Laravel server, a queue worker, a scheduler, MySQL and Redis.
#
#   cd server && podman compose up -d
#
# App: http://localhost:8001   Admin panel: http://localhost:8001/admin
#
# Published ports are offset from the defaults (8001, 3307, 6380) so this stack can run
# alongside other local projects. Settings come from .env; every value has a local-dev
# default. The source is bind-mounted, so PHP changes apply on the next request.
# Containers reach MySQL and Redis by service name; .env holds the published ports for
# host-side tools such as the Laravel Boost MCP server.

name: lafamilia

x-laravel: &laravel
  build:
    context: .
    dockerfile: Containerfile
  image: localhost/lafamilia-server:dev
  restart: always # Podman restarts only "always" containers at boot (podman-restart.service)
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
    LOG_CHANNEL: stderr
  volumes:
    - .:/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  server:
    <<: *laravel
    ports:
      - 127.0.0.1:${APP_PORT:-8001}:8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 15s

  queue:
    <<: *laravel
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0"]
    healthcheck:
      disable: true # the image's default check probes the web server

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true # the image's default check probes the web server

  mysql:
    image: docker.io/library/mysql:9.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-lafamilia-root}
      MYSQL_DATABASE: ${DB_DATABASE:-lafamilia}
      MYSQL_USER: ${DB_USERNAME:-lafamilia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lafamilia}
    ports:
      - 127.0.0.1:${DB_PORT:-3307}:3306
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-lafamilia-root}"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: docker.io/library/redis:8.10-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6380}:6379
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 10

volumes:
  mysql:
    name: lafamilia-mysql
  redis:
    name: lafamilia-redis
